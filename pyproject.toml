[project]
name = "asa-golf"
version = "0.1.0"
description = "UC Davis women's golf performance data foundation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asa_golf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
